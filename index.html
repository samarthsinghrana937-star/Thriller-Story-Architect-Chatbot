<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mistral Thriller AI</title>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --chat-bg: #1a1a1a;
            --text-color: #e0e0e0;
            --accent-color: #ff4d4d; 
            --user-msg: #2d2d2d;
            --ai-msg: #4a0000;
        }

        body {
            font-family: 'Georgia', serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        #chat-container {
            width: 90%;
            max-width: 800px;
            height: 80vh;
            background-color: var(--chat-bg);
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.2);
            overflow: hidden;
            border: 1px solid #333;
        }

        #header {
            padding: 20px;
            background: linear-gradient(90deg, #4a0000, #ff4d4d);
            text-align: center;
            font-weight: bold;
            font-size: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        #messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 80%;
            padding: 12px 18px;
            border-radius: 8px;
            line-height: 1.6;
            word-wrap: break-word;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .user {
            align-self: flex-end;
            background-color: var(--user-msg);
            border-left: 4px solid var(--accent-color);
        }

        .ai {
            align-self: flex-start;
            background-color: var(--ai-msg);
            border-left: 4px solid #ff0000;
            font-style: italic;
        }

        #input-area {
            padding: 20px;
            background-color: #000;
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 12px 20px;
            border-radius: 5px;
            border: 1px solid #444;
            background-color: #111;
            color: white;
            font-size: 1rem;
            outline: none;
        }

        button {
            padding: 12px 25px;
            border-radius: 5px;
            border: none;
            background-color: var(--accent-color);
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
        }

        button:hover {
            background-color: #ff0000;
            box-shadow: 0 0 10px #ff0000;
        }

        #messages::-webkit-scrollbar { width: 6px; }
        #messages::-webkit-scrollbar-thumb { background: #4a0000; border-radius: 10px; }
    </style>
</head>
<body>

    <div id="chat-container">
        <div id="header">Thriller Story Architect</div>
        <div id="messages"></div>
        <div id="input-area">
            <input type="text" id="user-input" placeholder="Enter a plot seed..." onkeypress="if(event.key==='Enter') sendMessage()">
            <button onclick="sendMessage()">Weave Story</button>
        </div>
    </div>

    <script>
        async function sendMessage() {
            const input = document.getElementById('user-input');
            const messagesDiv = document.getElementById('messages');
            const text = input.value.trim();

            if (!text) return;

            messagesDiv.innerHTML += `<div class="message user">${text}</div>`;
            input.value = '';
            messagesDiv.scrollTop = messagesDiv.scrollHeight;

            const aiMsgDiv = document.createElement('div');
            aiMsgDiv.className = 'message ai';
            aiMsgDiv.innerText = 'The ink is flowing...';
            messagesDiv.appendChild(aiMsgDiv);

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });

                const data = await response.json();
                aiMsgDiv.innerText = data.response || data.error;
            } catch (err) {
                aiMsgDiv.innerText = 'The story was interrupted by a glitch in the void.';
            }
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }
    </script>
</body>
</html>
